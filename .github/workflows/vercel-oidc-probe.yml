name: Vercel OIDC Probe

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[oidc-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Exchange GitHub OIDC for Vercel access token
        id: exchange
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TEAM_ID: team_lvylZaui6gt5QxzzssXTIKma
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -X POST https://api.vercel.com/login/oauth/token             --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data 'client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD'             --data 'subject_token_type=urn:ietf:params:oauth:token-type:id_token'             --data 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode "team_id_or_slug=$TEAM_ID"             --data-urlencode "subject_token=$OIDC_TOKEN")"
          TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.access_token // empty')"
          if [ -z "$TOKEN" ]; then
            echo "::error::OIDC exchange did not return an access token"
            printf '%s' "$RESPONSE" | jq '{error,error_description}'
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel project API access
        shell: bash
        env:
          TOKEN: ${{ steps.exchange.outputs.token }}
          TEAM_ID: team_lvylZaui6gt5QxzzssXTIKma
          PROJECT_ID: prj_vBueQ0MqpZWsK5dZt8hOBleIqnYi
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/project.json -w '%{http_code}'             -H "Authorization: Bearer $TOKEN"             "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$TEAM_ID")"
          echo "Vercel project API status: $CODE"
          jq '{id,name,rootDirectory,link}' /tmp/project.json || true
          test "$CODE" = "200"
