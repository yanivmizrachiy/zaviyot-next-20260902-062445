name: Cleanup historical branches once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-branches]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete verified historical branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'backup/pre-canonical-cutover-20260922'
            'backup/pre-canonical-swap-20260907'
            'gpt/canonical-zaviyot-production-20260907'
            'gpt/harden-zaviyot-cutover-verification-20260907'
            'gpt/home-reader-max-space-20260907'
            'gpt/vercel-oidc-management-probe-20260907'
            'gpt/vercel-token-probe-20260907'
            'fix/legacy-zaviyot-route-20260910'
            'release/oidc-canonical-probe-20260910'
            'release/reader-hardening-20260910'
            'release/verify-legacy-prod-20260910'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              echo "deleted $branch"
            else
              echo "already absent $branch"
            fi
          done
