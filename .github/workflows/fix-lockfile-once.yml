name: One-shot lockfile repair

on:
  push:
    branches:
      - release/reader-hardening-20260910

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/reader-hardening-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair lockfile with project npm version
        run: |
          npm install -g npm@11.6.2
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile repair and remove this workflow
        run: |
          rm -f .github/workflows/fix-lockfile-once.yml
          git config user.name "Zaviyot Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json .github/workflows/fix-lockfile-once.yml
          git commit -m "fix: synchronize Zaviyot package lock"
          git push origin HEAD:release/reader-hardening-20260910
