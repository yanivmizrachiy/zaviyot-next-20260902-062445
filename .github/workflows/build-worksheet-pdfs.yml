name: Build worksheet PDFs

on:
  push:
    branches: [main]
    paths:
      - "src/components/worksheets/**"
      - "src/components/book/**"
      - "src/app/worksheets/**"
      - "src/app/api/book-pdf/**"
      - "scripts/build-static-print-pdf.mjs"
      - "scripts/build-booklet-pdf.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-worksheet-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worksheet-pdfs-main
  cancel-in-progress: true

jobs:
  pdfs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Install dependencies without mutating the lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Find Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium was not found on the runner" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Using Chrome: $CHROME"
      - name: Build color worksheet PDF
        env:
          PDF_OUT: public/booklet-worksheets/zaviyot-worksheets.pdf
          PDF_PATH: /worksheets/print?scope=worksheets&tone=color
          PDF_PORT: "4876"
        run: node scripts/build-static-print-pdf.mjs
      - name: Build black-white worksheet PDF
        env:
          PDF_OUT: public/booklet-worksheets/zaviyot-worksheets-bw.pdf
          PDF_PATH: /worksheets/print?scope=worksheets&tone=bw
          PDF_PORT: "4877"
        run: node scripts/build-static-print-pdf.mjs
      - name: Build color full-book PDF
        env:
          PDF_OUT: public/booklet/hoveret-zaviyot.pdf
          PDF_PATH: /worksheets/print?tone=color
          PDF_PORT: "4878"
        run: node scripts/build-static-print-pdf.mjs
      - name: Build black-white full-book PDF
        env:
          PDF_OUT: public/booklet/hoveret-zaviyot-bw.pdf
          PDF_PATH: /worksheets/print?tone=bw
          PDF_PORT: "4879"
        run: node scripts/build-static-print-pdf.mjs
      - name: Verify generated PDFs
        shell: bash
        run: |
          test -s public/booklet-worksheets/zaviyot-worksheets.pdf
          test -s public/booklet-worksheets/zaviyot-worksheets-bw.pdf
          test -s public/booklet/hoveret-zaviyot.pdf
          test -s public/booklet/hoveret-zaviyot-bw.pdf
          ls -lh public/booklet-worksheets/zaviyot-worksheets*.pdf public/booklet/hoveret-zaviyot*.pdf
      - name: Commit generated PDFs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/booklet-worksheets/zaviyot-worksheets.pdf public/booklet-worksheets/zaviyot-worksheets-bw.pdf public/booklet/hoveret-zaviyot.pdf public/booklet/hoveret-zaviyot-bw.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged"
          else
            git commit -m "chore: refresh worksheet PDFs [skip ci]"
            git push
          fi
