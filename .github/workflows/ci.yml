name: Zaviyot Next CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Install dependencies without mutating lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Lint
        run: npm run lint:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and architecture tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production route and download smoke tests
        run: npm run test:routes
