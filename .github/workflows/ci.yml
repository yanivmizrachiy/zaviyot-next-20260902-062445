name: Zaviyot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Pin npm to the repository package manager
        run: npm install --global npm@11.6.2
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and architecture tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production route and download smoke tests
        run: npm run test:routes
