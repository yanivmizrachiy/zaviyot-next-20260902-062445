name: Zaviyot Production Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: zaviyot-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-prod]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_lvylZaui6gt5QxzzssXTIKma
      VERCEL_PROJECT_ID: prj_vBueQ0MqpZWsK5dZt8hOBleIqnYi
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout exact main HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove canonical source and deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch origin main --force
          HEAD_SHA="$(git rev-parse HEAD)"
          ORIGIN_MAIN_SHA="$(git rev-parse origin/main)"
          test "$HEAD_SHA" = "$GITHUB_SHA"
          test "$HEAD_SHA" = "$ORIGIN_MAIN_SHA"
          test -z "$(git status --porcelain)"
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN"
            exit 1
          fi
          echo "Canonical source verified: yanivmizrachiy/zaviyot-next-20260902-062445@$HEAD_SHA"
          echo "Canonical Vercel target: $VERCEL_PROJECT_ID"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full repository checks
        run: npm run check

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Authenticate and bind only to canonical Zaviyot project
        shell: bash
        run: |
          set -euo pipefail
          vercel whoami --token "$VERCEL_TOKEN"
          rm -rf .vercel
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          const expectedProject = 'prj_vBueQ0MqpZWsK5dZt8hOBleIqnYi';
          const expectedOrg = 'team_lvylZaui6gt5QxzzssXTIKma';
          if (p.projectId !== expectedProject || p.orgId !== expectedOrg) {
            console.error(`Wrong Vercel link: ${p.orgId}/${p.projectId}`);
            process.exit(1);
          }
          console.log(`Verified Vercel link: ${p.orgId}/${p.projectId}`);
          NODE

      - name: Build canonical production artifact
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy Zaviyot 2 to canonical production URL
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes \
            --token "$VERCEL_TOKEN" \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef=main \
            --meta releaseSource=github-actions

      - name: Verify canonical production cutover
        shell: bash
        run: |
          set -euo pipefail
          URL='https://zaviyot.vercel.app/'
          for attempt in $(seq 1 18); do
            HTML="$(curl -fsSL -H 'Cache-Control: no-cache' "$URL" || true)"
            if printf '%s' "$HTML" | grep -Fq 'חוברת הוראת הזוויות לכיתה ז׳' \
              && printf '%s' "$HTML" | grep -Fq 'הורדת חוברת העבודה' \
              && ! printf '%s' "$HTML" | grep -Fq 'zaviyot-angles-loop.mp4'; then
              echo 'Canonical Zaviyot URL now serves Zaviyot 2.'
              exit 0
            fi
            sleep 10
          done
          echo '::error::zaviyot.vercel.app did not switch to the canonical Zaviyot 2 build'
          exit 1

      - name: Verify critical public routes and assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI https://zaviyot.vercel.app/booklet-worksheets/zaviyot-worksheets.pdf >/dev/null
          curl -fsSL https://zaviyot.vercel.app/hamchashot >/dev/null
          echo 'Critical Zaviyot routes/assets are reachable.'
